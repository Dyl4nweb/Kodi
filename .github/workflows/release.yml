name: Release & Build Windows Installer

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release Tag (e.g. v1.0.2)'
        required: false
        default: 'v1.0.2'

jobs:
  build-tauri:
    permissions:
      contents: write
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Install dependencies
        run: npm ci

      - name: Build Next.js Static Export
        run: npm run build

      - name: Build Tauri Windows Installer
        run: npx tauri build

      - name: Upload Windows Installer as Workflow Artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: KODI_1.0.0_x64-setup
          path: src-tauri/target/release/bundle/nsis/*.exe

      - name: Create GitHub Release & Upload Assets
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ inputs.tag || github.ref_name }}
          name: 'KODI ${{ inputs.tag || github.ref_name }}'
          body: |
            ## KODI — Windows Dynamic Island
            
            ### Download & Install:
            - **[KODI_1.0.0_x64-setup.exe](https://github.com/Dyl4nweb/Kodi/releases/download/${{ inputs.tag || github.ref_name }}/KODI_1.0.0_x64-setup.exe)**
            
            ### Highlights:
            - Google Antigravity AI quota monitoring
            - Spotify & Windows GSMTC media controls
            - CPU, RAM & Battery hardware telemetry
            - Movie Mode stealth hotkey (Ctrl + Alt + K)
            - 100% offline, zero cloud tracking
          files: |
            src-tauri/target/release/bundle/nsis/*.exe
          draft: false
          prerelease: false
